<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#faf7f3">
<meta name="description" content="Pangolin Loop is coming. Every meeting matters. Every commitment counts. Nothing stays undone.">
<title>Pangolin Loop — Something is coming</title>
<style>
:root{color-scheme:light;--cream:#faf7f3;--ink:#191d27;--rust:#ae542c;--muted:#65666e;--line:#eadbd0}
*{box-sizing:border-box}html{min-width:280px;background:var(--cream)}body{margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:var(--cream);overflow-x:hidden}button,a{-webkit-tap-highlight-color:transparent}[hidden]{display:none!important}
.page{min-height:100svh;position:relative;isolation:isolate;display:flex;flex-direction:column;overflow:hidden;background:radial-gradient(ellipse at 51% 46%,#fff 12%,#fdfbfa 42%,#f5eae3 100%)}
.ambient{position:absolute;inset:0;z-index:-1;overflow:hidden;pointer-events:none}.halo{position:absolute;width:420px;height:420px;border:95px solid #c9744320;border-radius:50%;left:-240px;top:-245px;animation:float 22s ease-in-out infinite alternate}.orbit{position:absolute;width:570px;height:570px;border:2px solid #b85b3266;border-radius:50%;right:-380px;top:8%;animation:float 19s ease-in-out infinite alternate-reverse}.orbit:before{content:"";position:absolute;inset:52px;border:1px solid #fff9;border-radius:50%}.orb{position:absolute;width:49px;height:49px;background:#efcbb8;border-radius:50%;left:45px;top:65px;box-shadow:0 0 55px #df986d20}.orb.second{left:-17px;top:310px;background:#f5cdb5}.dot{position:absolute;left:3.5%;top:46%;width:48px;height:48px;border-radius:50%;background:#efc9b744;animation:float 16s ease-in-out infinite alternate}
header{display:flex;justify-content:center;padding:clamp(32px,6vh,70px) 24px 18px}.brand{display:inline-flex;align-items:center;gap:20px}.mark{width:78px;height:78px;color:var(--rust);flex:none}.wordmark{font-family:Georgia,'Times New Roman',serif;font-size:clamp(25px,3.7vw,46px);font-weight:700;letter-spacing:.015em;white-space:nowrap}.wordmark em{color:var(--rust);font-weight:700}.tagline{font-family:Arial,Helvetica,sans-serif;margin-top:8px;font-size:clamp(8px,1vw,12px);letter-spacing:.29em;color:#68656a;font-weight:500}
main{width:min(1180px,100%);margin:auto;flex:1;padding:clamp(20px,5vh,58px) 30px clamp(56px,9vh,100px);text-align:center;position:relative}h1{font-size:clamp(42px,6.4vw,86px);line-height:1.06;letter-spacing:-.055em;margin:0 0 22px;font-weight:800;text-wrap:balance}h1 em{color:var(--rust);font-style:italic} .intro{display:flex;align-items:center;justify-content:center;gap:28px;margin:0 auto 38px}.intro:before,.intro:after{content:"";height:1px;background:linear-gradient(90deg,transparent,#bdb6b3);width:105px;flex-shrink:1}.intro:after{transform:rotate(180deg)}.intro p{font-size:clamp(16px,2.2vw,25px);line-height:1.5;color:var(--muted);margin:0;text-wrap:balance}
.timer{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:22px;width:min(100%,980px);margin:0 auto}.unit{position:relative;min-width:0;padding:22px 10px 24px;border:1px solid #fff;border-bottom-color:#f0cbb6;border-left-color:#f5d4c2;border-radius:27px;background:linear-gradient(140deg,#ffffffb8,#f4eae4bd);box-shadow:0 18px 26px -15px #9b583647,inset 0 0 0 1px #ffffff85;backdrop-filter:blur(5px)}.unit svg{width:33px;height:33px;color:var(--rust);margin-bottom:9px;stroke-width:1.9}.number{font-variant-numeric:tabular-nums;display:block;font-size:clamp(44px,7.3vw,88px);line-height:1.03;font-weight:800;letter-spacing:-.045em}.label{display:block;margin-top:12px;font-size:clamp(10px,1.4vw,16px);font-weight:600;letter-spacing:.25em;color:#55545a;padding-left:.25em}.launch-pill{display:inline-flex;align-items:center;justify-content:center;gap:15px;border:1.5px solid var(--rust);border-radius:999px;padding:13px 26px;margin:30px 0 0;background:#fff7;font-size:clamp(12px,1.6vw,17px);font-weight:600;letter-spacing:.08em}.launch-pill svg{width:27px;height:27px;color:var(--rust)}.launch-pill span{border-left:1px solid var(--rust);padding-left:16px}.target{font-size:12px;color:#716761;letter-spacing:.035em;margin:16px 0 0;line-height:1.6}.live{padding:34px 20px;border:1px solid #dfbda6;border-radius:28px;background:#fff9;box-shadow:0 18px 40px -25px #ad542c80;max-width:800px;margin:0 auto}.live h2{color:var(--rust);font-size:clamp(40px,7vw,80px);letter-spacing:-.04em;margin:0 0 12px}.live p{font-size:clamp(18px,2.5vw,25px);margin:0;line-height:1.5}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
footer{position:relative;background:#191c26;color:#faf7f3;padding:38px 24px 30px;min-height:112px}.waves{position:absolute;bottom:calc(100% - 2px);left:0;width:100%;height:100px;overflow:visible;pointer-events:none}.footer-inner{position:relative;display:flex;justify-content:center;align-items:center;gap:32px;flex-wrap:wrap}.footer-brand{display:flex;align-items:center;gap:14px}.footer-brand .mark{width:44px;height:44px;color:#c37545}.footer-brand .wordmark{font-size:24px;letter-spacing:.07em}.footer-brand .wordmark em{color:#c37545}.footer-tag{border-left:1px solid #b9b9bf;padding:12px 0 12px 32px;font-size:11px;letter-spacing:.38em;line-height:1.8}.footnote{text-align:center;margin:16px 0 0;color:#b8b1ad;font-size:10px;letter-spacing:.04em}
@keyframes float{from{transform:translate3d(0,0,0)}to{transform:translate3d(18px,24px,0)}}
@media(min-width:1500px){header{padding-top:74px}main{padding-top:44px;padding-bottom:110px}.timer{max-width:1080px}.unit{padding:25px 12px 28px}}
@media(max-width:650px){header{padding:32px 18px 22px}.brand{gap:12px}.mark{width:51px;height:51px}.wordmark{font-size:28px}.tagline{font-size:8px;letter-spacing:.22em}main{padding:30px 20px 95px}h1{font-size:clamp(40px,9vw,58px);letter-spacing:-.05em;margin-bottom:20px}.intro{margin-bottom:27px;gap:0}.intro:before,.intro:after{display:none}.intro p{max-width:310px;font-size:17px}.timer{grid-template-columns:repeat(2,minmax(0,1fr));max-width:370px;gap:14px}.unit{border-radius:22px;padding:17px 8px 20px}.unit svg{width:26px;height:26px;margin-bottom:7px}.number{font-size:62px}.label{font-size:10px;margin-top:9px;letter-spacing:.23em}.launch-pill{margin-top:26px;padding:12px 20px;font-size:12px;gap:12px}.launch-pill svg{width:23px;height:23px}.target{font-size:11px;margin-top:12px}.orbit{right:-455px;top:18%}.dot{left:-20px;top:37%}.halo{width:300px;height:300px;left:-195px;top:-180px;border-width:65px}.footer-inner{gap:16px;flex-direction:column}.footer-tag{border:0;padding:0;font-size:9px;letter-spacing:.28em;text-align:center}.footer-brand .wordmark{font-size:21px}.footer-brand .mark{width:35px;height:35px}footer{padding-top:22px}.waves{height:64px}}
@media(max-width:340px){main{padding-inline:14px}.wordmark{font-size:23px}.brand{gap:9px}.mark{width:43px;height:43px}.tagline{font-size:7px}.number{font-size:52px}.timer{gap:10px}.launch-pill{padding-inline:14px;font-size:10px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
@media(forced-colors:active){.ambient,.waves{display:none}.unit,.live,.launch-pill{border:1px solid CanvasText;box-shadow:none}footer{border-top:1px solid CanvasText}}
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" aria-hidden="true" style="position:absolute;overflow:hidden"><defs>
<symbol id="loop-mark" viewBox="0 0 100 100"><path d="M49 13C70 10 87 26 87 48S75 85 52 87 14 74 13 51 28 16 49 13Z" fill="none" stroke="currentColor" stroke-width="2.4"/><g fill="currentColor"><ellipse cx="50" cy="13" rx="11" ry="9" transform="rotate(14 50 13)"/><ellipse cx="79" cy="26" rx="10" ry="11" transform="rotate(-30 79 26)"/><ellipse cx="84" cy="70" rx="11" ry="10" transform="rotate(-40 84 70)"/><ellipse cx="36" cy="85" rx="11" ry="10" transform="rotate(25 36 85)"/><ellipse cx="14" cy="39" rx="9" ry="11" transform="rotate(20 14 39)"/></g></symbol>
<symbol id="calendar" viewBox="0 0 32 32"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="6" width="22" height="23" rx="2"/><path d="M10 3v7m12-7v7M5 13h22M10 19h12M10 24h12"/></g></symbol>
<symbol id="clock" viewBox="0 0 32 32"><g fill="none" stroke="currentColor" stroke-linecap="round"><circle cx="16" cy="16" r="13"/><path d="M16 8v9h6"/></g></symbol>
<symbol id="stopwatch" viewBox="0 0 32 32"><g fill="none" stroke="currentColor" stroke-linecap="round"><circle cx="16" cy="19" r="10.5"/><path d="M13 3h6m-3 0v5m8 2 2-2M16 13v7"/></g></symbol>
<symbol id="bolt" viewBox="0 0 32 32"><path fill="currentColor" d="M20 1 5 19h10l-3 12 15-19H17Z"/></symbol>
<symbol id="rocket" viewBox="0 0 32 32"><path fill="currentColor" d="M29 3C20 2 13 7 10 14l-6 1-3 6 9-1 2 2-1 9 6-3 1-6C25 19 30 12 29 3ZM21 9a3 3 0 1 1 0 6 3 3 0 0 1 0-6ZM7 23c-4 0-5 6-5 7 2-1 7-2 7-6Z"/></symbol>
</defs></svg>
<div class="page">
<div class="ambient" aria-hidden="true"><div class="halo"></div><div class="orbit"><i class="orb"></i><i class="orb second"></i></div><div class="dot"></div></div>
<header><div class="brand" aria-label="Pangolin Loop. Nothing stays undone."><svg class="mark" aria-hidden="true"><use href="#loop-mark"/></svg><div><div class="wordmark">PANGOLIN<em>LOOP</em></div><div class="tagline">NOTHING STAYS UNDONE</div></div></div></header>
<main>
<h1 id="headline">Something is <em>coming.</em></h1>
<div class="intro"><p>Every meeting matters. Every commitment counts.</p></div>
<section id="countdown" aria-label="Time remaining until launch">
<div class="timer" role="timer" aria-live="off" aria-label="Launch countdown">
<div class="unit"><svg aria-hidden="true"><use href="#calendar"/></svg><span class="number" id="days">00</span><span class="label">DAYS</span></div>
<div class="unit"><svg aria-hidden="true"><use href="#clock"/></svg><span class="number" id="hours">00</span><span class="label">HOURS</span></div>
<div class="unit"><svg aria-hidden="true"><use href="#stopwatch"/></svg><span class="number" id="minutes">00</span><span class="label">MINUTES</span></div>
<div class="unit"><svg aria-hidden="true"><use href="#bolt"/></svg><span class="number" id="seconds">00</span><span class="label">SECONDS</span></div>
</div>
<p class="launch-pill"><svg aria-hidden="true"><use href="#rocket"/></svg><span id="launch-copy">COUNTING DOWN TO LAUNCH</span></p>
</section>
<section class="live" id="live" aria-labelledby="live-title" hidden><h2 id="live-title">WE'RE LIVE!</h2><p>Pangolin Loop is officially here.</p></section>
<p class="target" id="target-date"></p>
<p class="sr-only" id="announcement" role="status" aria-live="polite"></p>
<noscript><p>Enable JavaScript to see the live countdown and launch date.</p></noscript>
</main>
<footer>
<svg class="waves" viewBox="0 0 1600 130" preserveAspectRatio="none" aria-hidden="true"><defs><linearGradient id="copper"><stop stop-color="#9a4725"/><stop offset=".35" stop-color="#d68a59"/><stop offset=".7" stop-color="#d7c4b5"/><stop offset="1" stop-color="#a65a35"/></linearGradient></defs><path d="M0 0C400 160 1050 190 1600 5V130H0Z" fill="#e7d7cb"/><path d="M0 35C400 20 940 235 1600 30V130H0Z" fill="url(#copper)"/><path d="M0 86C390-20 840 245 1600 49V130H0Z" fill="#282a35"/><path d="M0 128C450-40 960 240 1600 76V130H0Z" fill="#191c26"/></svg>
<div class="footer-inner"><div class="footer-brand" aria-label="Pangolin Loop"><svg class="mark" aria-hidden="true"><use href="#loop-mark"/></svg><span class="wordmark">PANGOLIN<em>LOOP</em></span></div><div class="footer-tag">NOTHING STAYS UNDONE.</div></div>
</footer>
</div>
<script>
'use strict';
// EDIT THIS ONE CONSTANT to change the fixed launch date and time.
// +02:00 is South African Standard Time (SAST), independent of visitor timezone.
const LAUNCH_AT = '2026-11-30T09:00:00+02:00';

const target = Date.parse(LAUNCH_AT);
const fields = Object.fromEntries(['days','hours','minutes','seconds'].map(key => [key, document.getElementById(key)]));
let interval;
let launched = false;

function remainingParts(targetMs, nowMs) {
  const total = Math.max(0, Math.ceil((targetMs - nowMs) / 1000));
  return {
    days: Math.floor(total / 86400),
    hours: Math.floor(total % 86400 / 3600),
    minutes: Math.floor(total % 3600 / 60),
    seconds: total % 60
  };
}
function renderCountdown() {
  const now = Date.now();
  const parts = remainingParts(target, now);
  for (const key of Object.keys(fields)) {
    const value = String(parts[key]).padStart(2, '0');
    if (fields[key].textContent !== value) fields[key].textContent = value;
  }
  if (now >= target) {
    document.getElementById('launch-copy').textContent = "WE'RE LIVE!";
    if (!launched) {
      launched = true;
      document.getElementById('countdown').hidden = true;
      document.getElementById('live').hidden = false;
      document.getElementById('headline').hidden = true;
      document.getElementById('announcement').textContent = "WE'RE LIVE! Pangolin Loop is officially here.";
      document.title = "Pangolin Loop — WE'RE LIVE!";
      if (interval) clearInterval(interval);
    }
    return;
  }
  document.getElementById('launch-copy').textContent = parts.days >= 1
    ? parts.days + (parts.days === 1 ? ' DAY TO LAUNCH' : ' DAYS TO LAUNCH')
    : 'LESS THAN A DAY TO LAUNCH';
}
if (Number.isFinite(target)) {
  const dateParts = Object.fromEntries(new Intl.DateTimeFormat('en-ZA', {
    timeZone:'Africa/Johannesburg', day:'numeric', month:'long', year:'numeric',
    hour:'2-digit', minute:'2-digit', hourCycle:'h23'
  }).formatToParts(new Date(target)).map(part => [part.type, part.value]));
  const label = dateParts.day + ' ' + dateParts.month + ' ' + dateParts.year
    + ' at ' + dateParts.hour + ':' + dateParts.minute;
  document.getElementById('target-date').textContent = 'Launching ' + label + ' SAST · UTC+2';
  renderCountdown();
  if (!launched) interval = setInterval(renderCountdown, 1000);
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) renderCountdown();
  });
} else {
  document.getElementById('countdown').hidden = true;
  document.getElementById('target-date').textContent = 'Launch date to be announced.';
}
</script>
</body>
</html>
